<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gnik: review analysis</title>
<style>
  :root { --ink:#1f2430; --mut:#7a8194; --card:#fff; --bg:#f3f5fb; --ok:#2ecc71; --warn:#f39c12; --bad:#e74c3c; --acc:#6c5ce7; }
  * { box-sizing: border-box; }
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 14px; background: var(--bg); color: var(--ink); }
  header { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  header h2 { font-size:17px; margin:0; }
  .logo { background:linear-gradient(135deg,var(--acc),#00cec9); color:#fff; width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-size:16px; }
  form { display:flex; gap:6px; margin-bottom:8px; }
  input { flex:1; padding:8px 10px; border:1px solid #d6dbea; border-radius:8px; font:inherit; }
  button, .chip { border:0; border-radius:8px; background:var(--acc); color:#fff; padding:8px 12px; font:inherit; cursor:pointer; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .chip { background:#e6e3ff; color:var(--acc); padding:4px 10px; font-size:12px; }
  .card { background:var(--card); border-radius:12px; padding:12px; margin-bottom:10px; box-shadow:0 1px 4px rgba(20,30,70,.08); }
  .card h3 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); }
  .verdict { display:flex; align-items:center; gap:12px; }
  .score { width:58px; height:58px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:18px; color:#fff; flex:none; }
  .rest { background:linear-gradient(135deg,var(--acc),#00cec9); color:#fff; border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .rest .n { font-size:18px; font-weight:700; }
  .rest .i { font-size:11px; opacity:.8; word-break:break-all; }
  .muted { color:var(--mut); font-size:12px; }
  .meal { margin:8px 0; }
  .meal .row { display:flex; justify-content:space-between; font-weight:600; }
  .bar { height:8px; background:#e9ecf5; border-radius:6px; overflow:hidden; margin-top:3px; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#00cec9,var(--ok)); border-radius:6px; }
  .flag { display:flex; gap:8px; align-items:center; padding:7px 9px; border-radius:8px; margin:5px 0; background:#fafbff; border:1px solid #eceff8; }
  .badge { font-size:11px; font-weight:700; color:#fff; padding:2px 7px; border-radius:20px; text-transform:uppercase; flex:none; }
  .high { background:var(--bad); } .medium { background:var(--warn); } .low { background:#f1c40f; color:#333; }
  .tag { font-size:11px; background:#eef; border-radius:20px; padding:1px 8px; color:var(--acc); }
</style>
</head>
<body>
<header><div class="logo">&#127860;</div><h2>Review insights</h2></header>
<form id="f"><input id="id" placeholder="restaurant id, e.g. osm:node/123"><button>Analyse</button></form>
<div class="chips" id="chips"></div>
<div id="out" class="muted">Click a restaurant on the map, pick a sample, or pass ?id=...&amp;name=...</div>
<script>
// Embed: /colony/gnik/?id=<restaurant_id>. All text is inserted with textContent.
const out = document.getElementById('out');
const ICON = { wait_time: '\u23F3', cleanliness: '\uD83E\uDDFD', service: '\uD83D\uDE45', price: '\uD83D\uDCB8', dish_warning: '\u26A0\uFE0F' };
const SAMPLES = [['Trattoria Roma', 'osm:node/123'], ['Sushi Garden', 'osm:node/456'], ['Burger Barn', 'osm:node/789'], ['Thai Orchid', 'osm:node/2024']];

function el(tag, text, cls) { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }
function card(title) { const c = el('div', null, 'card'); c.append(el('h3', title)); return c; }

function render(d, name) {
  const frag = document.createDocumentFragment();
  const h = el('div', null, 'rest');
  h.append(el('div', name || d.name || 'Selected restaurant', 'n'));
  frag.append(h);
  const pen = d.red_flags.reduce((n, f) => n + (f.severity === 'high' ? 25 : f.severity === 'medium' ? 12 : 5), 0);
  const avg = d.suggested_meals.length ? d.suggested_meals.reduce((n, m) => n + m.sentiment, 0) / d.suggested_meals.length : 0.5;
  const score = Math.max(0, Math.min(100, Math.round(avg * 100 - pen)));
  const v = card('Verdict');
  const row = el('div', null, 'verdict');
  const sc = el('div', String(score), 'score');
  sc.style.background = score >= 70 ? 'var(--ok)' : score >= 40 ? 'var(--warn)' : 'var(--bad)';
  const txt = el('div');
  txt.append(el('div', score >= 70 ? 'Looks like a safe bet' : score >= 40 ? 'Mixed reviews, choose carefully' : 'Proceed with caution'));
  txt.append(el('div', d.review_count + ' reviews analysed', 'muted'));
  txt.append(el('span', d.source === 'mock' ? 'demo data' : 'real reviews', 'tag'));
  row.append(sc, txt); v.append(row); frag.append(v);

  const m = card('Order this');
  if (!d.suggested_meals.length) m.append(el('div', 'No standout dishes yet', 'muted'));
  const max = Math.max(1, ...d.suggested_meals.map((x) => x.mentions));
  d.suggested_meals.forEach((x) => {
    const w = el('div', null, 'meal');
    const r = el('div', null, 'row');
    r.append(el('span', '\uD83C\uDF7D\uFE0F ' + x.dish), el('span', Math.round(x.sentiment * 100) + '% positive \u00B7 ' + x.mentions, 'muted'));
    const bar = el('div', null, 'bar'); const fill = el('i'); fill.style.width = Math.round((x.mentions / max) * 100) + '%'; bar.append(fill);
    w.append(r, bar); m.append(w);
  });
  frag.append(m);

  const f = card('Red flags');
  if (!d.red_flags.length) f.append(el('div', '\u2705 No red flags found', 'muted'));
  d.red_flags.forEach((x) => {
    const r = el('div', null, 'flag');
    r.append(el('span', ICON[x.type] || '\u26A0\uFE0F'), el('span', x.severity, 'badge ' + x.severity), el('span', x.text + ' (' + x.evidence_count + ' reviews)'));
    f.append(r);
  });
  frag.append(f);
  out.replaceChildren(frag);
}

async function load(id, name) {
  out.replaceChildren(el('div', 'Analysing reviews...', 'muted'));
  try {
    const r = await fetch('/t/gnik/reviews?id=' + encodeURIComponent(id) + '&name=' + encodeURIComponent(name || ''));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    render(d, name);
  } catch (e) {
    out.replaceChildren(el('div', 'Could not load: ' + e.message, 'muted'));
  }
}

SAMPLES.forEach(([n, s]) => { const c = el('button', n, 'chip'); c.type = 'button'; c.onclick = () => { document.getElementById('id').value = s; load(s, n); }; document.getElementById('chips').append(c); });
document.getElementById('f').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = document.getElementById('id').value.trim();
  if (v) load(v);
});
const params = new URLSearchParams(location.search);
const q = params.get('id') || params.get('restaurant_id');
if (q) { document.getElementById('f').hidden = true; document.getElementById('chips').hidden = true; document.getElementById('id').value = q; load(q, params.get('name') || ''); }
</script>
</body>
</html>
